name: Novel Agent Full Tests

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  full-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio fastapi httpx
      - name: Run full pytest suite (no real LLM)
        run: python -m pytest tests/ -q --tb=line -x --ignore=tests/smoke/test_llm_one_chapter.py

  e2e:
    runs-on: ubuntu-latest
    needs: full-pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: web/frontend
        run: npm ci
      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
      - name: Install Playwright browsers
        working-directory: web/frontend
        run: npx playwright install chromium --with-deps
      - name: Run Playwright E2E
        working-directory: web/frontend
        env:
          E2E_RUN: "1"
          E2E_SKIP_SERVER: ""
        run: npm run test:e2e