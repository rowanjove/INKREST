name: Novel Agent Full Tests

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  full-pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio fastapi httpx
      - name: Run full pytest suite (no real LLM)
        run: python -m pytest tests/ -q --tb=line -x --ignore=tests/smoke/test_llm_one_chapter.py