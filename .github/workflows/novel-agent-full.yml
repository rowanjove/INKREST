name: Novel Agent Full Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  full-pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio fastapi httpx
      - name: Run full pytest suite (no real LLM)
        run: python -m pytest tests/ -q --tb=line -x --ignore=tests/smoke/test_llm_one_chapter.py
      - name: API perf baseline
        run: python scripts/perf_api_baseline.py --check

  e2e:
    runs-on: ubuntu-latest
    needs: full-pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install frontend deps
        working-directory: web/frontend
        run: npm ci
      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
      - name: Run Electron unit tests
        working-directory: web/frontend
        run: npm run test:electron
      - name: Build Electron main process
        working-directory: web/frontend
        run: npm run build:electron
      - name: Check frontend bundle budget
        run: python scripts/check_frontend_bundle.py web/frontend/dist
      - name: Audit production dependencies
        working-directory: web/frontend
        run: npm run audit:prod
      - name: API perf baseline
        run: python scripts/perf_api_baseline.py --check
      - name: Install Playwright browsers
        working-directory: web/frontend
        run: npx playwright install chromium --with-deps
      - name: Run Playwright E2E
        working-directory: web/frontend
        env:
          E2E_RUN: "1"
          E2E_FIXTURES: "1"
          E2E_SKIP_SERVER: ""
        run: npm run test:e2e
