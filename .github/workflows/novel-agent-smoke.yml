name: Novel Agent Smoke

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-extras.txt pytest pytest-asyncio fastapi httpx ruff
      - name: Run Python static checks
        run: python -m ruff check novel_agent web tests
      - name: Run unit tests (exclude live LLM smoke)
        env:
          NOVEL_AGENT_DISABLE_LOCAL_TOKEN: "1"
        run: |
          python -m pytest tests/ --ignore=tests/smoke -q --tb=short
      - name: Run novel pipeline smoke chain
        env:
          NOVEL_AGENT_DISABLE_LOCAL_TOKEN: "1"
        run: |
          python -m pytest \
            tests/test_full_chain_chaos.py \
            tests/api/test_novel_smoke_chain.py \
            -q --tb=short
      - name: API perf baseline
        run: python scripts/perf_api_baseline.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install frontend deps
        working-directory: web/frontend
        run: npm ci
      - name: Frontend unit tests
        working-directory: web/frontend
        run: npm run test:unit
      - name: Electron unit tests
        working-directory: web/frontend
        run: npm run test:electron
      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
      - name: Build Electron main process
        working-directory: web/frontend
        run: npm run build:electron
      - name: Check frontend bundle budget
        run: python scripts/check_frontend_bundle.py web/frontend/dist
      - name: Audit production dependencies
        working-directory: web/frontend
        run: npm run audit:prod
