[project]
requires-python = ">=3.11,<3.13"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "dist-desktop", ".worktrees"]

[tool.ruff.lint]
# Phase 0 blocks syntax errors, undefined names, and invalid control flow.
# Import hygiene is migrated module-by-module during the V2 decomposition;
# enabling F401/F405/I001 globally would rewrite compatibility facades blindly.
select = ["E9", "F63", "F7", "F82"]
